name: Deploy promo site

# Publishes site/ to GitHub Pages at https://tseshongfeeshur.github.io/spw-folia/
# The site is fully static and self-contained (no build step, no network calls),
# so the only work here is uploading the directory.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          # The artifact root is site/, so no other repository directory is published.
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
